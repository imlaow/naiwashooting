<!doctype html>
<html lang="zh-CN" data-lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0e3b52" />
  <title>奶蛙枪战 · 地图大厅</title>
  <link rel="icon" href="assets/hero_1.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=ZCOOL+KuaiLe&family=Nunito:wght@600;800&display=swap" rel="stylesheet" />
</head>
<body>
  <div class="sky" aria-hidden="true"></div>
  <header class="top">
    <img class="logo" src="assets/hero_1.png" alt="" />
    <div class="brand">
      <h1 data-i18n="title.name">奶蛙枪战</h1>
      <span data-i18n="lobby.sub">地图大厅</span>
    </div>
    <div class="lang-switch">
      <button type="button" data-lang-btn="zh">中文</button><button type="button" data-lang-btn="en">EN</button>
    </div>
  </header>

  <section class="stats" id="stats" aria-live="polite"></section>

  <nav class="tabs" id="tabs" role="tablist"></nav>

  <main class="lobby">
    <section class="browse">
      <p class="theme-desc" id="theme-desc"></p>
      <div class="map-grid" id="grid" role="list"></div>
    </section>
    <aside class="detail" id="detail"></aside>
  </main>

  <footer class="foot">
    <p data-i18n="lobby.hint"></p>
  </footer>
  <script type="module" src="/src/lobby.js"></script>
</body>
</html>
