<!doctype html>
<html lang="zh-CN" data-lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0e3b52" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>奶蛙射击</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=ZCOOL+KuaiLe&family=Nunito:wght@600;800&display=swap" rel="stylesheet" />
</head>
<body>
  <div id="app">
  <div id="stage"></div>
  <div id="touch-hud">
    <button id="btn-mute" class="icon" data-i18n-label="hud.mute" aria-label="静音">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path class="fill" d="M4 9h4l5-4v14l-5-4H4z" /><path class="on" d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" /><path class="off" d="M16.5 9.5l5 5m0-5l-5 5" /></svg>
    </button>
    <button id="btn-pause" class="icon" data-i18n-label="hud.pause" aria-label="暂停">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14M16 5v14" /></svg>
    </button>
    <button id="btn-scores" class="icon net-only" data-i18n-label="hud.scores" aria-label="记分板">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 6h14M5 12h14M5 18h14" /></svg>
    </button>
    <button id="btn-chat" class="icon net-only" data-i18n-label="hud.chat" aria-label="聊天">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z" /></svg>
    </button>
  </div>
  <!-- Online, over the game and under the menus. Names and chat only ever go in as textContent. -->
  <div id="net-hud">
    <p id="net-banner" class="net-banner hidden" data-i18n="net.reconnecting">连接断开，正在重连…</p>
    <div class="chat">
      <div id="chat-log" class="chat-log" aria-live="polite"></div>
      <form id="chat-form" class="chat-form hidden" autocomplete="off">
        <input id="chat-input" type="text" maxlength="80" spellcheck="false" data-i18n-ph="chat.placeholder" placeholder="说点什么，回车发送" />
      </form>
    </div>
    <div id="scoreboard" class="scoreboard hidden">
      <table>
        <thead><tr><th data-i18n="score.name">玩家</th><th data-i18n="score.kills">击杀</th><th data-i18n="score.revives">救援</th><th data-i18n="score.downs">倒地</th><th data-i18n="score.ping">延迟</th></tr></thead>
        <tbody id="score-rows"></tbody>
      </table>
    </div>
  </div>
  <div id="overlay">
    <img class="decor kicker" src="assets/gunner.png" alt="" aria-hidden="true" />
    <img class="decor peeker" src="assets/egg.png" alt="" aria-hidden="true" />

    <div id="loading" class="panel"><div class="belly">
      <h2 data-i18n="loading.title">奶蛙射击</h2>
      <div class="bar"><div id="load-bar"></div></div>
      <p id="load-text">启动中…</p>
    </div></div>

    <div id="title" class="panel hidden"><div class="belly">
      <div class="lang-switch">
        <button data-lang-btn="zh">中文</button><button data-lang-btn="en">EN</button>
      </div>
      <img class="hero" src="assets/hero_1.png" alt="主角奶蛙" data-i18n-alt="title.heroAlt" />
      <h1><b data-i18n="title.name">奶蛙射击</b></h1>
      <button id="play" class="ghost" data-i18n="title.play">开始游戏</button>
      <button id="open-maps" class="ghost" data-i18n="title.maps">选择地图</button>
      <button id="open-online" class="ghost" data-i18n="title.online">联机</button>
      <p id="current-map" class="current-map"></p>
      <p id="best-score" class="best"></p>
      <div class="controls">
        <div><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> <span data-i18n="ctl.move">移动</span></div>
        <div><kbd data-i18n="ctl.mouse">鼠标</kbd> <span data-i18n="ctl.aim">瞄准射击</span></div>
        <div><kbd data-i18n="ctl.space">空格</kbd> <span data-i18n="ctl.dash">冲刺</span></div>
        <div><kbd>R</kbd> <span data-i18n="ctl.reload">换弹</span></div>
        <div><kbd>1</kbd>–<kbd>4</kbd> <span data-i18n="ctl.weapons">/ 滚轮 切换武器</span></div>
        <div><kbd>P</kbd> <span data-i18n="ctl.pause">暂停</span> · <kbd>M</kbd> <span data-i18n="ctl.mute">静音</span></div>
      </div>
      <p class="touch-note" data-i18n="title.touch">触屏：左手拇指移动（轻点冲刺），右手拇指瞄准射击。</p>
    </div></div>

    <div id="maps" class="panel wide hidden"><div class="belly">
      <h2 data-i18n="maps.title">地图</h2>
      <p class="tag" data-i18n="maps.tag">每个主题下有不同的地图。挑一张，出发！</p>
      <div id="map-themes"></div>
      <p class="touch-note" data-i18n="maps.more">更多主题，敬请期待</p>
      <div class="map-actions">
        <button id="map-back" class="ghost" data-i18n="maps.back">返回</button>
        <button id="map-play" class="ghost" data-i18n="maps.play">出发！</button>
      </div>
    </div></div>

    <div id="online" class="panel hidden"><div class="belly">
      <h2 data-i18n="online.title">联机</h2>
      <p class="tag" data-i18n="online.tag">加入朋友开的服务器，一起守岛。</p>
      <form id="net-form" class="net-form" autocomplete="off">
        <label><span data-i18n="online.address">服务器地址</span><input id="net-address" type="text" inputmode="url" placeholder="wss://…" spellcheck="false" autocapitalize="off" autocorrect="off" /></label>
        <div id="net-recent" class="net-recent"></div>
        <label><span data-i18n="online.name">你的名字</span><input id="net-name" type="text" maxlength="16" spellcheck="false" autocapitalize="off" autocorrect="off" /></label>
        <label><span data-i18n="online.password">密码（没有就留空）</span><input id="net-password" type="password" /></label>
        <p id="net-status" class="net-status" role="status"></p>
        <div class="map-actions">
          <button type="button" id="net-back" class="ghost" data-i18n="online.back">返回</button>
          <button type="submit" id="net-join" class="ghost" data-i18n="online.join">加入</button>
        </div>
      </form>
    </div></div>

    <div id="netmenu" class="panel hidden"><div class="belly">
      <h2 data-i18n="netmenu.title">联机中</h2>
      <p class="tag" data-i18n="netmenu.note">联机时游戏不会暂停</p>
      <button id="net-resume" class="ghost" data-i18n="netmenu.back">回到游戏</button>
      <button id="net-leave" class="ghost" data-i18n="netmenu.leave">离开服务器</button>
    </div></div>

    <div id="netover" class="panel hidden"><div class="belly">
      <h2 data-i18n="netover.title">本局结束</h2>
      <div class="stats">
        <div><span data-i18n="over.score">得分</span><b id="no-score">0</b></div>
        <div><span data-i18n="over.wave">波次</span><b id="no-wave">0</b></div>
        <div><span data-i18n="over.kills">击杀</span><b id="no-kills">0</b></div>
        <div><span data-i18n="netover.mine">你的击杀</span><b id="no-mine">0</b></div>
      </div>
      <p id="no-next" class="current-map"></p>
      <button id="net-leave2" class="ghost" data-i18n="netmenu.leave">离开服务器</button>
    </div></div>

    <div id="lost" class="panel hidden"><div class="belly">
      <h2 data-i18n="lost.title">连接断开</h2>
      <p class="tag" data-i18n="lost.text">和服务器的连接断开了。</p>
      <button id="lost-ok" class="ghost" data-i18n="lost.ok">返回主菜单</button>
    </div></div>

    <div id="pause" class="panel hidden"><div class="belly">
      <div class="lazy" aria-hidden="true"><img src="assets/hero_3.png" alt="" /><i></i><i></i><i></i></div>
      <h2 data-i18n="pause.title">已暂停</h2>
      <button id="resume" class="ghost" data-i18n="pause.resume">继续</button>
      <button id="quit" class="ghost" data-i18n="pause.quit">返回主菜单</button>
    </div></div>

    <div id="over" class="panel hidden"><div class="belly">
      <div class="splat" aria-hidden="true"><img class="pancake" src="assets/hero_1.png" alt="" /><img class="mourner" src="assets/egg.png" alt="" /></div>
      <h2 data-i18n="over.title">奶蛙阵亡</h2>
      <div class="stats">
        <div><span data-i18n="over.score">得分</span><b id="go-score">0</b></div>
        <div><span data-i18n="over.wave">波次</span><b id="go-wave">0</b></div>
        <div><span data-i18n="over.kills">击杀</span><b id="go-kills">0</b></div>
        <div><span data-i18n="over.best">最高分</span><b id="go-best">0</b></div>
      </div>
      <p id="go-map" class="current-map"></p>
      <button id="again" class="ghost" data-i18n="over.again">再来一局</button>
      <button id="over-maps" class="ghost" data-i18n="over.maps">换张地图</button>
    </div></div>
  </div>
  </div>
  <!-- Roughens the menu panels' yellow rim into fur. -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <filter id="fur" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="7" />
      <feDisplacementMap in="SourceGraphic" scale="9" />
    </filter>
  </svg>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
