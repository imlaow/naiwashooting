<!doctype html>
<html lang="zh-CN" data-lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>奶蛙枪战</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=ZCOOL+KuaiLe&family=Nunito:wght@600;800&display=swap" rel="stylesheet" />
</head>
<body>
  <div id="stage"></div>
  <div id="overlay">
    <div id="loading" class="panel">
      <h2 data-i18n="loading.title">奶蛙枪战</h2>
      <div class="bar"><div id="load-bar"></div></div>
      <p id="load-text">启动中…</p>
    </div>

    <div id="title" class="panel hidden">
      <div class="lang-switch">
        <button data-lang-btn="zh">中文</button><button data-lang-btn="en">EN</button>
      </div>
      <img class="hero" src="assets/hero_1.png" alt="主角奶蛙" data-i18n-alt="title.heroAlt" />
      <h1><b data-i18n="title.name">奶蛙枪战</b><span data-i18n="title.sub">海岛大作战</span></h1>
      <p class="tag" data-i18n="title.tag">敌对奶蛙入侵了你的热带小岛。拿起武器，守卫海滩！</p>
      <button id="play" data-i18n="title.play">开始游戏</button>
      <p id="best-score" class="best"></p>
      <div class="controls">
        <div><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> <span data-i18n="ctl.move">移动</span></div>
        <div><kbd data-i18n="ctl.mouse">鼠标</kbd> <span data-i18n="ctl.aim">瞄准射击</span></div>
        <div><kbd data-i18n="ctl.space">空格</kbd> <span data-i18n="ctl.dash">冲刺</span></div>
        <div><kbd>R</kbd> <span data-i18n="ctl.reload">换弹</span></div>
        <div><kbd>1</kbd>–<kbd>4</kbd> <span data-i18n="ctl.weapons">/ 滚轮 切换武器</span></div>
        <div><kbd>P</kbd> <span data-i18n="ctl.pause">暂停</span> · <kbd>M</kbd> <span data-i18n="ctl.mute">静音</span></div>
      </div>
      <p class="touch-note" data-i18n="title.touch">触屏：左手拇指移动（轻点冲刺），右手拇指瞄准射击。</p>
    </div>

    <div id="pause" class="panel hidden">
      <h2 data-i18n="pause.title">已暂停</h2>
      <button id="resume" data-i18n="pause.resume">继续</button>
      <button id="quit" class="ghost" data-i18n="pause.quit">返回标题</button>
    </div>

    <div id="over" class="panel hidden">
      <h2 data-i18n="over.title">奶蛙阵亡</h2>
      <div class="stats">
        <div><span data-i18n="over.score">得分</span><b id="go-score">0</b></div>
        <div><span data-i18n="over.wave">波次</span><b id="go-wave">0</b></div>
        <div><span data-i18n="over.kills">击杀</span><b id="go-kills">0</b></div>
        <div><span data-i18n="over.best">最高</span><b id="go-best">0</b></div>
      </div>
      <button id="again" data-i18n="over.again">再来一局</button>
    </div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
